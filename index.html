<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>週刊ゲーム | 開いた瞬間に遊べるショートゲーム</title>
  <meta name="description" content="タップするだけ。数秒のゲームが次々に流れてくる。何ステージ突破できる？">
  <meta property="og:title" content="週刊ゲーム | 開いた瞬間に遊べるショートゲーム">
  <meta property="og:description" content="タップするだけ。数秒のゲームが次々に流れてくる。何ステージ突破できる？">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yamasinagames.github.io/weekly-games/">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <div id="app">
    <header class="hud">
      <span id="lives"></span>
      <span id="score">0</span>
    </header>
    <div class="timer"><div id="timerBar"></div></div>
    <div class="stage-wrap">
      <main id="stage"></main>
      <div id="instruction" class="instruction"></div>
      <div id="between" class="between hidden">
        <div id="betweenMark"></div>
        <div id="betweenText"></div>
      </div>
    </div>
    <section id="result" class="result hidden">
      <p>突破ステージ</p>
      <div id="resultScore"></div>
      <p id="resultSub"></p>
      <button class="primary" id="shareBtn">結果をXでシェア</button>
      <button class="secondary" id="retryBtn">もう一回</button>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
