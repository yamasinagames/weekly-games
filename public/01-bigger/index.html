<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>大きいのどっち？ | 週刊ゲーム</title>
  <meta name="description" content="大きい数字を10回タップするだけ。あなたのクリアタイムは？">
  <meta property="og:title" content="大きいのどっち？ | 週刊ゲーム">
  <meta property="og:description" content="大きい数字を10回タップするだけ。あなたのクリアタイムは？">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yamasinagames.github.io/weekly-games/01-bigger/">
  <meta name="twitter:card" content="summary">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
      background: #fafafa;
      color: #222;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }
    .screen { display: none; flex: 1; flex-direction: column; justify-content: center; text-align: center; }
    .screen.active { display: flex; }
    h1 { font-size: 2rem; margin: 0 0 12px; }
    p { color: #666; margin: 0 0 24px; line-height: 1.6; }
    button { font: inherit; border: none; cursor: pointer; }
    .primary {
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: #222;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .secondary {
      padding: 16px;
      font-size: 1rem;
      color: #222;
      background: #e8e8e8;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .hud { display: flex; justify-content: space-between; font-size: 1.1rem; font-variant-numeric: tabular-nums; margin-bottom: 16px; }
    .cards { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    .card {
      flex: 1;
      font-size: 4.5rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: #222;
    }
    .card.miss { background: #ffd6d6; }
    .time { font-size: 3.5rem; font-weight: bold; font-variant-numeric: tabular-nums; margin: 0 0 8px; }
    .sub { margin-bottom: 32px; }
    .back { display: block; margin-top: 12px; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <section id="title" class="screen active">
      <h1>大きいのどっち？</h1>
      <p>大きい数字を10回タップしよう。<br>まちがえると +1秒。</p>
      <button class="primary" id="startBtn">スタート</button>
      <p id="bestTitle"></p>
    </section>

    <section id="game" class="screen">
      <div class="hud">
        <span id="round">1 / 10</span>
        <span id="timer">0.00</span>
      </div>
      <div class="cards">
        <button class="card" id="cardA"></button>
        <button class="card" id="cardB"></button>
      </div>
    </section>

    <section id="result" class="screen">
      <p>クリアタイム</p>
      <div class="time" id="resultTime"></div>
      <p class="sub" id="resultSub"></p>
      <button class="primary" id="shareBtn">結果をXでシェア</button>
      <button class="secondary" id="retryBtn">もう一回</button>
      <a class="back" href="../">ほかのゲーム</a>
    </section>
  </main>

  <script>
    const ROUNDS = 10;
    const PENALTY = 1000;
    const URL_SELF = "https://yamasinagames.github.io/weekly-games/01-bigger/";
    const BEST_KEY = "weekly-games:01-bigger:best";

    const $ = (id) => document.getElementById(id);
    const cards = [$("cardA"), $("cardB")];

    let round, misses, startAt, timerId, values, finalMs;

    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
    }

    function loadBest() {
      try { return Number(localStorage.getItem(BEST_KEY)) || null; } catch { return null; }
    }

    function saveBest(ms) {
      try { localStorage.setItem(BEST_KEY, String(ms)); } catch {}
    }

    function fmt(ms) {
      return (ms / 1000).toFixed(2);
    }

    function renderBest() {
      const best = loadBest();
      $("bestTitle").textContent = best ? `自己ベスト ${fmt(best)}秒` : "";
    }

    function elapsed() {
      return performance.now() - startAt + misses * PENALTY;
    }

    function nextPair() {
      const a = Math.floor(Math.random() * 99) + 1;
      let b;
      do { b = Math.floor(Math.random() * 99) + 1; } while (b === a);
      values = [a, b];
      cards.forEach((c, i) => {
        c.textContent = values[i];
        c.classList.remove("miss");
      });
      $("round").textContent = `${round + 1} / ${ROUNDS}`;
    }

    function start() {
      round = 0;
      misses = 0;
      show("game");
      nextPair();
      startAt = performance.now();
      timerId = setInterval(() => { $("timer").textContent = fmt(elapsed()); }, 30);
    }

    function pick(i) {
      if (!$("game").classList.contains("active")) return;
      if (values[i] > values[1 - i]) {
        round++;
        if (round === ROUNDS) finish();
        else nextPair();
      } else {
        misses++;
        cards[i].classList.add("miss");
        if (navigator.vibrate) navigator.vibrate(80);
      }
    }

    function finish() {
      clearInterval(timerId);
      finalMs = elapsed();
      const best = loadBest();
      const isBest = !best || finalMs < best;
      if (isBest) saveBest(finalMs);
      $("resultTime").textContent = `${fmt(finalMs)}秒`;
      $("resultSub").textContent =
        `ミス ${misses}回` + (isBest ? " ／ 自己ベスト更新！" : ` ／ 自己ベスト ${fmt(best)}秒`);
      show("result");
      renderBest();
    }

    function share() {
      const text = `「大きいのどっち？」を${fmt(finalMs)}秒でクリア！（ミス${misses}回）\n#週刊ゲーム`;
      const url = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(URL_SELF)}`;
      window.open(url, "_blank");
    }

    // pointerdown の方が click より反応が速い
    cards.forEach((c, i) => c.addEventListener("pointerdown", (e) => { e.preventDefault(); pick(i); }));
    $("startBtn").addEventListener("click", start);
    $("retryBtn").addEventListener("click", start);
    $("shareBtn").addEventListener("click", share);
    renderBest();
  </script>
</body>
</html>
